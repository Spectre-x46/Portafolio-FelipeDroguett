[build]
  command   = "npm run build"
  publish   = "dist"

# Rutas prerenderizadas. Cada una tiene su propio HTML con su contenido y sus
# metadatos, escritos en el build por scripts/prerender.mjs. Van antes del
# comodín: si éste las alcanzara, LinkedIn, WhatsApp y compañía volverían a ver
# la preview de la home al compartir un case study.
[[redirects]]
  from   = "/caso/tokyo-tunning"
  to     = "/caso/tokyo-tunning/index.html"
  status = 200

[[redirects]]
  from   = "/caso/agente-comercial"
  to     = "/caso/agente-comercial/index.html"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    X-XSS-Protection           = "1; mode=block"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
